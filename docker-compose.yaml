name: local-llm

services:
  ollama:
    image: ollama/ollama:0.30.7
    container_name: local-llm-ollama
    volumes:
      - ${HOME}/.ollama:/root/.ollama
    ports:
      - 11434:11434
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: local-llm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./.docker/postgres/:/var/lib/postgresql/data
    ports:
      - 54310:5432
    restart: unless-stopped

networks:
  default:
    name: local-llm
